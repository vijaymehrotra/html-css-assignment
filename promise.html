<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="currency.css">
</head>
<body>
    <form action="">
        <div class="container">
            <div class="amount">
                <h3>Currency Converter</h3>
                <input value="100" type="text">
            </div>
            <div class="dropdown">
                <div class="from">
                    <p>FROM</p>
                    <div class="select-container">
                        <img src="https://flagsapi.com/US/flat/64.png" alt="">
                    </div>
                    <select name="from"></select>
                </div>
                <div class="to">
                    <p>TO</p>
                    <div class="select-container">
                        <img src="https://flagsapi.com/IN/flat/64.png" alt="">
                    </div>
                    <select name="to"></select>
                </div>
            </div>
            <hr>
            <input type="text" name="" id="result" readonly>
            <div class="msg">1 USD = 80 INR</div>
            <button id="form-button">Get Exchange Rate</button>
        </div>
    </form> 

    <script src="codes.js"></script>
    <script src="currency.js"></script>
</body>
</html>
